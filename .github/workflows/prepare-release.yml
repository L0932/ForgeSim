name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate release tag, for example v0.1.0-preview.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Validate Windows release
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: windows-2022
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $release = & ./scripts/Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG

          "version=$($release.Version)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "prerelease=$($release.Prerelease)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Candidate version: $($release.Version)"
          Write-Host "Source commit: $env:GITHUB_SHA"

      - name: Configure
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          cmake -S . -B out/build/release `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DFORGESIM_BUILD_SANDBOX=ON `
            -DFORGESIM_BUILD_TESTS=ON `
            "-DFORGESIM_VERSION_PRERELEASE=$env:RELEASE_PRERELEASE" `
            "-DFORGESIM_EXPECTED_VERSION=$env:RELEASE_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "Release configuration failed."
          }

      - name: Build Release
        run: |
          cmake --build out/build/release --config Release --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Release build failed."
          }

      - name: Run headless tests
        run: |
          ctest --test-dir out/build/release `
            -C Release `
            --output-on-failure `
            --no-tests=error `
            --timeout 120

          if ($LASTEXITCODE -ne 0) {
            throw "Release tests failed."
          }

      - name: Package portable ZIP
        run: |
          cpack --config out/build/release/CPackConfig.cmake `
            -C Release `
            -G ZIP

          if ($LASTEXITCODE -ne 0) {
            throw "Portable ZIP packaging failed."
          }

      - name: Package Windows installer
        run: |
          $nsisDirectory = "${env:ProgramFiles(x86)}\NSIS"

          if (Test-Path "$nsisDirectory\makensis.exe") {
            $env:PATH = "$nsisDirectory;$env:PATH"
          }

          cpack --config out/build/release/CPackConfig.cmake `
            -C Release `
            -G NSIS

          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer packaging failed."
          }

      - name: Verify packages and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $packageDirectory = "out/build/release/packages"
          $baseName = "ForgeSim-$env:RELEASE_VERSION-Windows-AMD64"

          $packageNames = @(
            "$baseName.zip"
            "$baseName-Setup.exe"
          )

          foreach ($name in $packageNames) {
            $packagePath = Join-Path $packageDirectory $name
            $checksumPath = "$packagePath.sha256"

            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Expected package is missing: $packagePath"
            }

            if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
              throw "Expected checksum is missing: $checksumPath"
            }

            $checksumText = Get-Content -LiteralPath $checksumPath -Raw

            if ($checksumText -notmatch '^\s*([0-9A-Fa-f]{64})\s+') {
              throw "Invalid SHA-256 checksum file: $checksumPath"
            }

            $expectedHash = $Matches[1]
            $actualHash = (
              Get-FileHash -LiteralPath $packagePath -Algorithm SHA256
            ).Hash

            if ($actualHash -ne $expectedHash) {
              throw "Checksum mismatch for $name"
            }

            # Keep checksum files compatible with sha256sum -c:
            # UTF-8 without BOM, filename only, and an LF line ending.
            $normalizedChecksum = (
              $actualHash.ToLowerInvariant() + "  " + $name + "`n"
            )

            [System.IO.File]::WriteAllText(
              $checksumPath,
              $normalizedChecksum,
              [System.Text.UTF8Encoding]::new($false)
            )

            Write-Host "Verified: $name"
          }

      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ForgeSim-${{ steps.version.outputs.version }}-Windows
          path: |
            out/build/release/packages/ForgeSim-*.zip
            out/build/release/packages/ForgeSim-*.zip.sha256
            out/build/release/packages/ForgeSim-*-Setup.exe
            out/build/release/packages/ForgeSim-*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-failure-diagnostics
          path: |
            out/build/release/CMakeCache.txt
            out/build/release/CMakeFiles/CMakeConfigureLog.yaml
            out/build/release/Testing/Temporary/LastTest.log
            out/build/release/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7

  prepare-draft:
    name: Prepare draft release
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 10

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.build-and-test.outputs.version }}
      SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ForgeSim-${{ needs.build-and-test.outputs.version }}-Windows
          path: release-assets

      - name: Create or update draft
        run: |
          function Invoke-Gh {
            param([string[]] $Arguments)

            $result = & gh @Arguments

            if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI command failed: gh $($Arguments -join ' ')"
            }

            return $result
          }

          $repository = $env:GH_REPO
          $tag = $env:RELEASE_TAG
          $commit = $env:SOURCE_COMMIT

          # Verify an existing tag points to the exact commit we built.
          $references = (
            Invoke-Gh -Arguments @(
              "api",
              "repos/$repository/git/matching-refs/tags/$tag"
            )
          ) | ConvertFrom-Json

          $existingTag = @(
            $references | Where-Object { $_.ref -ceq "refs/tags/$tag" }
          )

          if ($existingTag.Count -gt 0) {
            # The commits endpoint also resolves annotated tags.
            $tagCommit = (
              Invoke-Gh -Arguments @(
                "api",
                "repos/$repository/commits/$tag"
              )
            ) | ConvertFrom-Json

            if ($tagCommit.sha -ne $commit) {
              throw "Tag '$tag' points to another commit. Use a new release tag."
            }
          }

          # Include drafts and paginate rather than assuming only one page.
          $pages = (
            Invoke-Gh -Arguments @(
              "api", "--paginate", "--slurp",
              "repos/$repository/releases?per_page=100"
            )
          ) | ConvertFrom-Json

          $matchingReleases = @(
            foreach ($page in $pages) {
              foreach ($release in $page) {
                if ($release.tag_name -ceq $tag) {
                  $release
                }
              }
            }
          )

          if ($matchingReleases.Count -gt 1) {
            throw "Multiple releases found for '$tag'; inspect them manually."
          }

          $existingRelease = $matchingReleases | Select-Object -First 1

          if ($null -ne $existingRelease) {
            if (-not $existingRelease.draft) {
              throw "Release '$tag' is already published. It will not be modified."
            }

            if ($existingRelease.target_commitish -ne $commit) {
              throw "Draft '$tag' targets another commit. Use a new release tag."
            }
          }

          # Upload only the four expected release files.
          $baseName = "ForgeSim-$env:RELEASE_VERSION-Windows-AMD64"
          $assetNames = @(
            "$baseName.zip"
            "$baseName.zip.sha256"
            "$baseName-Setup.exe"
            "$baseName-Setup.exe.sha256"
          )

          $assetPaths = @(
            foreach ($name in $assetNames) {
              $path = Join-Path "release-assets" $name

              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Release asset is missing: $name"
              }

              $path
            }
          )

          if ($null -eq $existingRelease) {
            $runUrl = (
              "$env:GITHUB_SERVER_URL/$repository/actions/runs/" +
              "$env:GITHUB_RUN_ID"
            )

            @(
              "Prepared from commit: $commit"
              ""
              "Build and automated checks: $runUrl"
              ""
              "Before publishing, verify application launch, rendering,"
              "editor interactions, installation, and package contents."
              ""
              "Windows x64. Requires an OpenGL 4.6-capable graphics driver."
              "This preview is unsigned."
              ""
            ) | Set-Content -Path release-notes.md -Encoding utf8

            $createArguments = @(
              "release", "create", $tag,
              "--repo", $repository,
              "--draft",
              "--target", $commit,
              "--title", "ForgeSim $env:RELEASE_VERSION",
              "--notes-file", "release-notes.md",
              "--generate-notes"
            )

            if ($tag.Contains("-")) {
              $createArguments += "--prerelease"
            }

            Invoke-Gh -Arguments $createArguments
          }

          # Retry replaces matching assets only on the verified draft.
          $uploadArguments = @(
            "release", "upload", $tag,
            "--repo", $repository,
            "--clobber"
          ) + $assetPaths

          Invoke-Gh -Arguments $uploadArguments

          $draftUrl = Invoke-Gh -Arguments @(
            "release", "view", $tag,
            "--repo", $repository,
            "--json", "url",
            "--jq", ".url"
          )

          "Draft release: $draftUrl" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
