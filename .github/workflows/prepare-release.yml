name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate release tag, for example v0.1.0-preview.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Validate Windows release
    runs-on: windows-2022
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $release = & ./scripts/Get-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG

          "version=$($release.Version)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "prerelease=$($release.Prerelease)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Candidate version: $($release.Version)"
          Write-Host "Source commit: $env:GITHUB_SHA"

      - name: Configure
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          cmake -S . -B out/build/release `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DFORGESIM_BUILD_SANDBOX=ON `
            -DFORGESIM_BUILD_TESTS=ON `
            "-DFORGESIM_VERSION_PRERELEASE=$env:RELEASE_PRERELEASE" `
            "-DFORGESIM_EXPECTED_VERSION=$env:RELEASE_VERSION"

          if ($LASTEXITCODE -ne 0) {
            throw "Release configuration failed."
          }

      - name: Build Release
        run: |
          cmake --build out/build/release --config Release --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Release build failed."
          }

      - name: Run headless tests
        run: |
          ctest --test-dir out/build/release `
            -C Release `
            --output-on-failure `
            --no-tests=error `
            --timeout 120

          if ($LASTEXITCODE -ne 0) {
            throw "Release tests failed."
          }

                - name: Package portable ZIP
        run: |
          cpack --config out/build/release/CPackConfig.cmake `
            -C Release `
            -G ZIP

          if ($LASTEXITCODE -ne 0) {
            throw "Portable ZIP packaging failed."
          }

      - name: Package Windows installer
        run: |
          $nsisDirectory = "${env:ProgramFiles(x86)}\NSIS"

          if (Test-Path "$nsisDirectory\makensis.exe") {
            $env:PATH = "$nsisDirectory;$env:PATH"
          }

          cpack --config out/build/release/CPackConfig.cmake `
            -C Release `
            -G NSIS

          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer packaging failed."
          }

      - name: Verify packages and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $packageDirectory = "out/build/release/packages"
          $baseName = "ForgeSim-$env:RELEASE_VERSION-Windows-AMD64"

          $packageNames = @(
            "$baseName.zip"
            "$baseName-Setup.exe"
          )

          foreach ($name in $packageNames) {
            $packagePath = Join-Path $packageDirectory $name
            $checksumPath = "$packagePath.sha256"

            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Expected package is missing: $packagePath"
            }

            if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
              throw "Expected checksum is missing: $checksumPath"
            }

            $checksumText = Get-Content -LiteralPath $checksumPath -Raw

            if ($checksumText -notmatch '^\s*([0-9A-Fa-f]{64})\s+') {
              throw "Invalid SHA-256 checksum file: $checksumPath"
            }

            $expectedHash = $Matches[1]
            $actualHash = (
              Get-FileHash -LiteralPath $packagePath -Algorithm SHA256
            ).Hash

            if ($actualHash -ne $expectedHash) {
              throw "Checksum mismatch for $name"
            }

            # Keep checksum files compatible with sha256sum -c:
            # UTF-8 without BOM, filename only, and an LF line ending.
            $normalizedChecksum = (
              $actualHash.ToLowerInvariant() + "  " + $name + "`n"
            )

            [System.IO.File]::WriteAllText(
              $checksumPath,
              $normalizedChecksum,
              [System.Text.UTF8Encoding]::new($false)
            )

            Write-Host "Verified: $name"
          }

      - name: Upload release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ForgeSim-${{ steps.version.outputs.version }}-Windows
          path: |
            out/build/release/packages/ForgeSim-*.zip
            out/build/release/packages/ForgeSim-*.zip.sha256
            out/build/release/packages/ForgeSim-*-Setup.exe
            out/build/release/packages/ForgeSim-*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-failure-diagnostics
          path: |
            out/build/release/CMakeCache.txt
            out/build/release/CMakeFiles/CMakeConfigureLog.yaml
            out/build/release/Testing/Temporary/LastTest.log
            out/build/release/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7